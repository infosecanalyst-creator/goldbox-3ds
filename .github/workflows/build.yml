name: build-3dsx
# Builds goldbox.3dsx with devkitARM and publishes it (with the build log) to the `builds`
# branch, so it can be tested in an emulator and installed over Wi-Fi without a local build.
on:
  push:
    branches: ["**", "!builds"]
  workflow_dispatch:
permissions:
  contents: write
# One run at a time: an older run that finishes last must not overwrite the builds branch
# (seen on ja2-3ds Nov 20). Queued runs wait; only the newest pending one is kept.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git make python3 ca-certificates >/dev/null
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Build
        run: make -f Makefile.3ds -j$(nproc) 2>&1 | tee build.log; test -f goldbox.3dsx
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp goldbox.3dsx build.log out/ 2>/dev/null || true
          # symbols for reading crash addresses: gzipped ELF (addr2line) and a demangled nm map
          # (the full -g ELF gzips to ~100 MB, over GitHub's file limit: past 50 MB publish it without the
          # DWARF line tables; function symbols, and so addr2line -f, still work)
          gzip -9c goldbox.elf > out/goldbox.elf.gz 2>/dev/null || true
          if [ "$(stat -c%s out/goldbox.elf.gz 2>/dev/null || echo 0)" -gt 50000000 ]; then
            "$DEVKITARM/bin/arm-none-eabi-objcopy" --strip-debug goldbox.elf goldbox-nodebug.elf && gzip -9c goldbox-nodebug.elf > out/goldbox.elf.gz || rm -f out/goldbox.elf.gz
          fi
          "$DEVKITARM/bin/arm-none-eabi-nm" -C -n goldbox.elf 2>/dev/null | gzip -9 > out/goldbox.sym.gz || true
          echo "$GITHUB_SHA" > out/SOURCE_COMMIT
      - name: Publish to builds branch
        if: success()   # never replace the last good build with a failed one; failed-build logs stay in the Actions run
        run: |
          cd out
          git init -q -b builds
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
